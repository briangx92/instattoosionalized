<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Scripts may only come from this folder. If you set portal-api below, add its origin to connect-src here too. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://portal.instattoosionalized.net https://api.instattoosionalized.net; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<!-- Address of the shop server (for example https://portal.example.com). Empty means the portal runs on its own data only. -->
<meta name="portal-api" content="">
<!-- Address of the calendar Worker (portal hostname). Separate from portal-api on purpose: different backend, different auth (Access cookie, no token). -->
<meta name="gcal-api" content="https://portal.instattoosionalized.net">
<title>Owner portal | Instattoosionalized</title>
<link rel="icon" href="../assets/instattoosionalized-logo.jpg">
<link rel="preload" href="fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/portal.css">
</head>
<body>
<div id="app"></div>
<div id="lock" class="lock" role="dialog" aria-modal="true" aria-labelledby="lock-title">
  <form id="lock-form" class="lock-card">
    <p class="lock-kicker">Instattoosionalized</p>
    <h1 id="lock-title" class="lock-title">Owner portal</h1>
    <p class="lock-sub">This portal is private. Type the shop passcode to open it.</p>
    <label class="lock-label" for="lock-code">Passcode</label>
    <input id="lock-code" class="lock-input" type="password" autocomplete="current-password" placeholder="Shop passcode">
    <button id="lock-btn" class="lock-btn" type="submit">Open the portal</button>
    <p id="lock-note" class="lock-note" aria-live="polite"></p>
  </form>
</div>
<noscript><p style="padding:2rem;font:16px system-ui">The owner portal needs JavaScript. Turn it on in your browser and reload.</p></noscript>
<script src="js/lock.js"></script>
<script src="js/util.js"></script>
<script src="js/seed-data.js"></script>
<script src="js/social.js"></script>
<script src="js/content.js"></script>
<script src="js/schedule.js"></script>
<script src="js/store.js"></script>
<script src="js/actions.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/ui.js"></script>
<script src="js/qr.js"></script>
<script src="js/timing.js"></script>
<script src="js/shared.js"></script>
<script src="js/gcal.js"></script>
<script src="js/api.js"></script>
<script src="js/views/today.js"></script>
<script src="js/views/requests.js"></script>
<script src="js/views/calendar.js"></script>
<script src="js/views/clients.js"></script>
<script src="js/views/artists.js"></script>
<script src="js/views/analytics.js"></script>
<script src="js/views/site.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
